name: evo_motor
description: >
  Motor de simulação de ordem unida (close-order drill) do Evo — pacote Dart
  puro, sem dependência de Flutter ou Firebase. Roda em `dart test` em
  milissegundos; é a camada que precisa sobreviver independente de qualquer
  decisão de backend ou de UI.
version: 0.1.0
publish_to: none

environment:
  sdk: ^3.9.0

dependencies:
  meta: ^1.15.0

dev_dependencies:
  lints: ^5.0.0
  test: ^1.25.0
